apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Setting uid to the literal string "DS_PROMETHEUS" lets the dashboard's
    # ${DS_PROMETHEUS} template variable resolve automatically without any
    # manual configuration in the Grafana UI.
    uid: DS_PROMETHEUS
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
