# Note: You can run `docker compose up` directly from the project root!
# This file is also configured so running it from inside the `docker/` folder works.

services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ecg-inference-api
    ports:
      - "8000:8000"
    volumes:
      - ../models_store:/app/models_store
    environment:
      - CANARY_TRAFFIC_RATIO=0.0
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: ecg-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecg-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data: